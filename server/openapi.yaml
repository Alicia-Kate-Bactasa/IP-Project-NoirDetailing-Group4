        `Paid` cash/counter payment. Emails a receipt when an address is supplied.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, service_id]
              properties:
                full_name:
                  type: string
                  example: Juan Dela Cruz
                phone_number:
                  type: string
                  default: Walk-In Counter
                email:
                  type: string
                  format: email
                service_id:
                  type: integer
                  example: 1
                scheduled_date:
                  type: string
                  format: date
                  description: Defaults to today.
                time_slot:
                  type: string
                  default: Walk-In Immediate
                price:
                  type: number
                  description: Defaults to the service price, then 250.
      responses:
        '201':
          description: Walk-in logged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      customer:
                        $ref: '#/components/schemas/Customer'
                      booking:
                        $ref: '#/components/schemas/Booking'
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/dashboard-stats:
    get:
      tags: [Admin]
      summary: Dashboard counters (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregated statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/billing/run:
    post:
      tags: [Admin]
      summary: Run the recurring-billing sweep now (admin)
      description: |
        Executes the same code path as the daily node-cron job — reminder pass,
        saved-card charges and auto-invoicing/dunning.

        `dry_run` defaults to the `AUTO_BILLING_DRY_RUN` environment flag, so a
        production deployment stays log-only unless explicitly overridden.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  description: When true nothing is charged or written.
                subscription_id:
                  type: integer
                  description: Restrict the sweep to a single subscription.
      responses:
        '200':
          description: Sweep finished. `data` is the run summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      dryRun:
                        type: boolean
                      timezone:
                        type: string
                        example: Asia/Manila
                      scanned:
                        type: integer
                      charged:
                        type: array
                        items:
                          type: object
                      invoiced:
                        type: array
                        items:
                          type: object
                      dunning:
                        type: array
                        items:
                          type: object
                      failed:
                        type: array
                        items:
                          type: object
                      expired:
                        type: array
                        items:
                          type: object
                      reminded:
                        type: array
                        items:
                          type: object
                      skipped:
                        type: array
                        items:
                          type: object
                      errors:
                        type: array
                        items:
                          type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/billing/periods:
    get:
      tags: [Admin]
      summary: Inspect the recurring-billing ledger (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BillingPeriodStatus'
        - name: take
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Billing periods plus the current scheduler configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      periods:
                        type: array
                        items:
                          $ref: '#/components/schemas/BillingPeriod'
                      dry_run:
                        type: boolean
                      cron:
                        type: string
                        example: 0 8 * * *
                      timezone:
                        type: string
                        example: Asia/Manila
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Feedback
  # ---------------------------------------------------------------------------
  /feedback:
    get:
      tags: [Feedback]
      summary: List all feedback
      security: []
      responses:
        '200':
          description: Feedback entries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Feedback'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Feedback]
      summary: Submit feedback for a completed booking
      description: Only allowed once, and only when the booking status is `Completed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, rating]
              properties:
                booking_id:
                  type: integer
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comments:
                  type: string
      responses:
        '201':
          description: Feedback recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Feedback'
        '400':
          description: Validation failure, or booking not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Feedback already submitted for this booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /feedback/verify-booking/{bookingId}:
    get:
      tags: [Feedback]
      summary: Check whether a booking can be reviewed
      description: Non-numeric characters are stripped from the path value, so `MTG-42` resolves to booking `42`.
      security: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
          example: 'MTG-42'
      responses:
        '200':
          description: Booking is eligible for review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      booking_id:
                        type: integer
                      customer_name:
                        type: string
                      service_name:
                        type: string
                      service_price:
                        $ref: '#/components/schemas/Money'
                      scheduled_date:
                        type: string
                        format: date-time
                      time_slot:
                        type: string
        '400':
          description: Invalid id, or the service is not completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Feedback already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT from `POST /auth/login` (or `POST /payments/verify` in registration
        mode). Send as `Authorization: Bearer <token>`. Expires after 7 days.

  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      description: Service primary key (`service_id`).
      schema:
        type: integer
        minimum: 1
    BookingId:
      name: id
      in: path
      required: true
      description: Booking primary key (`booking_id`).
      schema:
        type: integer
        minimum: 1
    PaymentId:
      name: id
      in: path
      required: true
      description: Payment primary key (`payment_id`).
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Missing or invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Zod validation failure listing the offending fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthorized:
      description: Missing, malformed or expired Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but lacking the required role (Admin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unhandled server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Invalid email address or password.

    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Validation failure
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: body.service_id
              message:
                type: string
                example: Valid service_id is required

    MessageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string

    Money:
      type: string
      description: Decimal amount serialized as a string to preserve precision.
      example: '1500.00'

    UserRole:
      type: string
      enum: [Admin, Subscriber, Customer]

    BookingStatus:
      type: string
      enum:
        - Pending
        - Pending_Verification
        - Confirmed
        - Completed
        - Cancelled
        - No_Show
        - Paid
        - Scheduled

    CustomerType:
      type: string
      enum: [Regular, Walk_In]

    InvoiceType:
      type: string
      enum: [Single_Detailing, Monthly_Roster]

    InvoiceStatus:
      type: string
      enum: [Paid, Pending, Void]

    PaymentStatus:
      type: string
      enum: [Paid, Pending_Approval, Rejected]

    PlanStatus:
      type: string
      enum: [Active, Payment_Pending, Expired, Cancellation_Pending]

    BillingPeriodStatus:
      type: string
      enum: [Scheduled, Invoiced, Processing, Paid, Failed, Skipped]

    Service:
      type: object
      description: A detailing package.
      properties:
        service_id:
          type: integer
          example: 1
        service_name:
          type: string
          maxLength: 100
          example: Full Interior Detail
        service_price:
          $ref: '#/components/schemas/Money'
        service_category:
          type: string
          maxLength: 50
          example: Interior
        service_duration:
          type: integer
          description: Duration in minutes.
          example: 120
        service_description:
          type: string
          nullable: true
        last_updated_by:
          type: string
          nullable: true
          example: Admin
        is_active:
          type: boolean
          default: true

    ServiceInput:
      type: object
      required: [service_name, service_price]
      properties:
        service_name:
          type: string
          maxLength: 100
        service_price:
          type: number
          example: 1500
        service_category:
          type: string
          default: Detailing
        service_duration:
          type: integer
          default: 60
        service_description:
          type: string
        is_active:
          type: boolean
          default: true

    User:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
          format: email
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    Customer:
      type: object
      properties:
        customer_id:
          type: integer
        full_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          nullable: true
        customer_type:
          $ref: '#/components/schemas/CustomerType'
        booking_count:
          type: integer

    Subscription:
      type: object
      properties:
        subscription_id:
          type: integer
        user_id:
          type: integer
          nullable: true
        plan_tier:
          type: string
          example: VIP Membership Roster
        plan_status:
          $ref: '#/components/schemas/PlanStatus'
        created_at:
          type: string
          format: date-time
          nullable: true
        last_billing_date:
          type: string
          format: date-time
          nullable: true
        next_billing_date:
          type: string
          format: date-time
          nullable: true
        completed_sessions_count:
          type: integer
          nullable: true
        grace_period_start:
          type: string
          format: date-time
          nullable: true
        auto_renew:
          type: boolean
          description: When false the plan expires at the end of the paid period.
        retry_count:
          type: integer
        last_billing_attempt_at:
          type: string
          format: date-time
          nullable: true
        reminder_sent_at:
          type: string
          format: date-time
          nullable: true
        canceled_at:
          type: string
          format: date-time
          nullable: true
        payment_method_brand:
          type: string
          nullable: true
        payment_method_last4:
          type: string
          nullable: true
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        billing_periods:
          type: array
          items:
            $ref: '#/components/schemas/BillingPeriod'

    BillingPeriod:
      type: object
      description: |
        One recurring-billing cycle. The unique `(subscription_id, period_start)`
        pair is the idempotency guard that prevents double charging.
      properties:
        period_id:
          type: integer
        subscription_id:
          type: integer
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/BillingPeriodStatus'
        amount:
          $ref: '#/components/schemas/Money'
        invoice_id:
          type: integer
          nullable: true
        attempt_count:
          type: integer
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        invoice:
          allOf:
            - $ref: '#/components/schemas/Invoice'
          nullable: true

    Booking:
      type: object
      description: An appointment. Relations are present only when the endpoint includes them.
      properties:
        booking_id:
          type: integer
        customer_id:
          type: integer
          nullable: true
        user_id:
          type: integer
          nullable: true
        service_id:
          type: integer
        scheduled_date:
          type: string
          format: date-time
          description: Calendar date; the time component is always 00:00:00Z.
        time_slot:
          type: string
          example: '10:00 AM'
        bay_number:
          type: integer
          default: 1
        purchased_price:
          $ref: '#/components/schemas/Money'
        booking_status:
          $ref: '#/components/schemas/BookingStatus'
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        service:
          allOf:
            - $ref: '#/components/schemas/Service'
          nullable: true
        customer:
          allOf:
            - $ref: '#/components/schemas/Customer'
          nullable: true
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        feedback:
          allOf:
            - $ref: '#/components/schemas/Feedback'
          nullable: true

    Invoice:
      type: object
      properties:
        invoice_id:
          type: integer
        booking_id:
          type: integer
          nullable: true
        subscription_id:
          type: integer
          nullable: true
        total_amount:
          $ref: '#/components/schemas/Money'
        issued_at:
          type: string
          format: date-time
          nullable: true
        invoice_type:
          $ref: '#/components/schemas/InvoiceType'
        invoice_status:
          $ref: '#/components/schemas/InvoiceStatus'
        booking:
          allOf:
            - $ref: '#/components/schemas/Booking'
          nullable: true
        subscription:
          allOf:
            - $ref: '#/components/schemas/Subscription'
          nullable: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'

    Payment:
      type: object
      properties:
        payment_id:
          type: integer
        invoice_id:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        payment_date:
          type: string
          format: date-time
          nullable: true
        payment_method:
          type: string
          nullable: true
          example: GCash
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        proof_of_payment:
          type: string
          example: GCASH-REF-889231

    Feedback:
      type: object
      properties:
        feedback_id:
          type: integer
        booking_id:
          type: integer
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        comments:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        booking:
          allOf:
            - $ref: '#/components/schemas/Booking'
          nullable: true

    DashboardStats:
      type: object
      properties:
        total_bookings:
          type: integer
        pending_bookings:
          type: integer
        active_subscribers:
          type: integer
        pending_payments:
          type: integer
        total_revenue:
          $ref: '#/components/schemas/Money'

    RegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        full_name:
          type: string
          description: Used as the username; falls back to the email local part.
        phone_number:
          type: string

    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
        token:
          type: string
          description: 7-day JWT.
        user:
          type: object
          properties:
            user_id:
              type: integer
            email:
              type: string
              format: email
            full_name:
              type: string
            role:
              $ref: '#/components/schemas/UserRole'

    BookingCreateRequest:
      type: object
      required: [service_id, scheduled_date, time_slot]
      properties:
        service_id:
          type: integer
          example: 2
        scheduled_date:
          type: string
          format: date
          example: '2026-11-05'
        time_slot:
          type: string
          example: '2:00 PM'
        bay_number:
          type: integer
          default: 1
        full_name:
          type: string
          description: Required for guest bookings when no customer record exists.
        phone_number:
          type: string
        email:
          type: string
          format: email

    BookingCreatedResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            message:
              type: string
            booking_id:
              type: integer
            invoice_id:
              type: integer
            booking_status:
              $ref: '#/components/schemas/BookingStatus'
            total_amount:
              $ref: '#/components/schemas/Money'

    CheckoutRequest:
      type: object
      description: |
        At least one of `invoice_id`, `booking_id` or `subscription_id` must resolve
        to an invoice. `amount` / `service_name` are accepted for backward
        compatibility but ignored — the invoice total and service name win.
      properties:
        invoice_id:
          type: integer
        booking_id:
          type: integer
        subscription_id:
          type: integer
        amount:
          type: number
          deprecated: true
          description: Ignored. The invoice total is used instead.
          example: 1500
        service_name:
          type: string
          deprecated: true
          description: Ignored. Derived from the linked service / plan tier.
        client_email:
          type: string
          format: email
          deprecated: true
        return_url:
          type: string
          format: uri
          description: Where PayMongo redirects after checkout. Falls back to the Referer header, then PUBLIC_APP_URL.

    RegistrationVerifiedResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Payment verified! Member account created and VIP Membership activated.
        token:
          type: string
        user:
          type: object
          properties:
            user_id:
              type: integer
            email:
              type: string
              format: email
            full_name:
              type: string
            role:
              $ref: '#/components/schemas/UserRole'

    PaymentVerifiedResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Payment verified and status updated to Paid & Confirmed.
        data:
          type: object
          properties:
            success:
              type: boolean
            payment:
              allOf:
                - $ref: '#/components/schemas/Payment'
              nullable: true
