openapi: 3.0.3

info:
  title: Noir Detailing API
  version: 1.0.0
  description: |
    Custom RESTful API for the **Noir Detailing** auto-detailing booking and VIP
    membership platform (Express + Prisma).

    ### Base path
    All endpoints are served under `/api/v1`. In local development the API runs on
    `http://localhost:5001`; in production it is proxied behind Apache at
    `https://noir-detailing.dcism.org`.

    ### Response envelope
    Most endpoints return:

    ```json
    { "status": "success", "message": "...", "data": { } }
    ```

    A few collection endpoints intentionally return a bare JSON array
    (`GET /bookings/user/bookings`, `GET /admin/bookings`, `GET /admin/invoices`,
    `GET /admin/subscriptions`) and errors use:

    ```json
    { "status": "error", "message": "..." }
    ```

    ### Authentication
    Protected routes expect a Bearer JWT issued by `POST /auth/login` (or by
    `POST /payments/verify` after a paid VIP registration). Tokens expire in 7 days
    and carry `userId`, `email` and `role`.

    ### Money & dates
    Prisma `Decimal` values are serialized as **strings** (e.g. `"1500.00"`) to
    preserve precision. `DateTime` values are ISO-8601 strings; calendar-only
    values (`scheduled_date`) always carry a `00:00:00Z` time component.

    ### Known limitation
    `POST /payments/verify` is currently unauthenticated and trusts the redirect
    query string rather than a signed PayMongo webhook. Do not treat it as a
    trusted payment confirmation in production.

  license:
    name: Educational / Capstone Project

servers:
  - url: http://localhost:5001/api/v1
    description: Local development
  - url: https://noir-detailing.dcism.org/api/v1
    description: Production (Apache reverse proxy)

tags:
  - name: Health
    description: Service liveness probe.
  - name: Auth
    description: Registration, login, profile and password recovery.
  - name: Services
    description: Detailing package catalog (CRUD + activation toggles).
  - name: Bookings
    description: Appointment scheduling, availability, reschedule and cancellation.
  - name: Payments
    description: PayMongo checkout, manual proof of payment, and admin approvals.
  - name: Subscriptions
    description: VIP membership roster lifecycle.
  - name: Admin
    description: Administrative dashboards and walk-in counter bookings.
  - name: Feedback
    description: Post-service customer ratings.

paths:
  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns service status and the current server timestamp.
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: Noir Detailing API
                  timestamp:
                    type: string
                    format: date-time

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/pre-register:
    post:
      tags: [Auth]
      summary: Start VIP membership pre-registration (PayMongo checkout)
      description: |
        Validates the signup payload, stores it in a temporary `PendingRegistration`
        record (2-hour expiry) with a bcrypt password hash, then creates a PayMongo
        Checkout Session for the ₱1,500 monthly VIP roster.

        No `User`, `Customer`, `Subscription` or `Invoice` rows are created until
        `POST /payments/verify` redeems the returned `reg_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Checkout session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  checkout_url:
                    type: string
                    format: uri
                    description: PayMongo hosted checkout URL to redirect the customer to.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/register:
    post:
      tags: [Auth]
      summary: Alias of /auth/pre-register
      description: Same handler as `POST /auth/pre-register`; kept for client compatibility.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Checkout session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  checkout_url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      description: |
        Verifies the password against the stored bcrypt hash (legacy PHP `$2y$`
        hashes are normalised to `$2a$`) and returns a 7-day JWT.

        Rate limited to 20 requests per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: member@example.com
                password:
                  type: string
                  format: password
                  example: hunter2
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials or invalid email/password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 12
                      email:
                        type: string
                        format: email
                      username:
                        type: string
                      role:
                        $ref: '#/components/schemas/UserRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a 6-digit password reset OTP
      description: |
        Generates a cryptographically random 6-digit code valid for 1 hour, stores it
        in `user_security_actions`, and emails it via SMTP.

        Always returns `200` for unknown addresses to prevent email enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset code dispatched (or silently ignored for unknown emails).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Validate a password reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: '481920'
      responses:
        '200':
          description: Code is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password using a valid OTP
      description: Requires a non-expired OTP; on success all reset actions for the email are invalidated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                newPassword:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------
  /services:
    get:
      tags: [Services]
      summary: List detailing packages
      security: []
      parameters:
        - name: include_inactive
          in: query
          required: false
          description: Pass `true` to include soft-deleted (inactive) packages.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Catalog retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Services]
      summary: Create a detailing package (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Package created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /services/{id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Services]
      summary: Get one detailing package
      security: []
      responses:
        '200':
          description: Package retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Services]
      summary: Update a detailing package (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '200':
          description: Package updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Services]
      summary: Soft-delete a detailing package (admin)
      description: Sets `is_active` to `false`; the row is never physically removed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Package deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /services/{id}/toggle:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    patch:
      tags: [Services]
      summary: Toggle a package's active state (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Activation state flipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service package deactivated successfully.
                  data:
                    $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Bookings
  # ---------------------------------------------------------------------------
  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      description: |
        Admins receive every booking. Non-admin callers receive only their own
        bookings, resolved by the authenticated email. Unknown accounts get an
        empty list rather than an error.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by booking status.
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: date
          in: query
          required: false
          description: Filter by scheduled date (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Bookings retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Bookings]
      summary: Create a booking (guest or subscriber)
      description: |
        Validated with Zod. Atomically creates the `Booking`, a linked `Invoice`
        (`Single_Detailing`) and increments the customer's booking count.

        - Authenticated user with an **Active** subscription → status `Pending`,
          invoice amount `0.00`, invoice status `Paid`.
        - Guest (or subscriber without an active plan) → status
          `Pending_Verification`, invoice amount equals the service price, invoice
          status `Pending`.

        Subscriber benefits are only granted from a valid Bearer token; a
        client-supplied `user_id` is never trusted.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '201':
          description: Booking and invoice created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Service missing or inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Bay already booked for that slot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /bookings/availability:
    get:
      tags: [Bookings]
      summary: List occupied slots for a date
      security: []
      parameters:
        - name: date
          in: query
          required: true
          description: Calendar date to inspect (YYYY-MM-DD).
          schema:
            type: string
            format: date
            example: '2026-11-05'
      responses:
        '200':
          description: Occupied slots (Cancelled and No-Show bookings are excluded).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      booked_slots:
                        type: array
                        items:
                          type: object
                          properties:
                            booking_id:
                              type: integer
                            time_slot:
                              type: string
                            bay_number:
                              type: integer
                            service_id:
                              type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /bookings/member:
    post:
      tags: [Bookings]
      summary: Create a ₱0.00 VIP member booking
      description: |
        Requires an authenticated user with an **Active** subscription. Creates a
        `Confirmed` booking with a `Paid` zero-amount invoice in one transaction.
        Always uses bay `1`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, scheduled_date, time_slot]
              properties:
                service_id:
                  type: integer
                  example: 3
                scheduled_date:
                  type: string
                  format: date
                  example: '2026-11-06'
                time_slot:
                  type: string
                  example: '10:00 AM'
      responses:
        '201':
          description: VIP appointment reserved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: VIP Appointment reserved successfully at ₱0.00 invoice!
                  data:
                    type: object
                    properties:
                      booking:
                        $ref: '#/components/schemas/Booking'
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No active VIP subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or service not found / inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slot already occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /bookings/user/bookings:
    get:
      tags: [Bookings]
      summary: List the caller's bookings (bare array)
      description: Returns a **bare JSON array** (no envelope). On internal failure it returns `200 []` rather than an error.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bookings for the authenticated account, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bookings/{id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    put:
      tags: [Bookings]
      summary: Reschedule a booking
      description: |
        Admins may reschedule any booking; customers only their own. Checks slot
        collisions (excluding the booking being moved) and emails the new details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_date, time_slot]
              properties:
                scheduled_date:
                  type: string
                  format: date
                time_slot:
                  type: string
                bay_number:
                  type: integer
      responses:
        '200':
          description: Booking rescheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Target slot already occupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /bookings/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    put:
      tags: [Bookings]
      summary: Cancel a booking
      description: |
        Sets the booking to `Cancelled`, voids any `Pending` invoice, and emails a
        cancellation notice. Admins may cancel any booking; customers only their own.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /bookings/{id}/status:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    put:
      tags: [Bookings]
      summary: Update booking status (admin)
      description: |
        Minimal status setter. Prefer `PUT /admin/bookings/{id}/status`, which
        validates the status against the enum and sends notification emails.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_status]
              properties:
                booking_status:
                  $ref: '#/components/schemas/BookingStatus'
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Payments
  # ---------------------------------------------------------------------------
  /payments/invoices:
    get:
      tags: [Payments]
      summary: List invoices with payments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
      responses:
        '200':
          description: Invoices retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /payments:
    post:
      tags: [Payments]
      summary: Submit manual proof of payment
      description: |
        Records a GCash / bank transfer reference against an invoice with status
        `Pending Approval` for admin review.

        The caller must own the invoice (or be an admin). The invoice total is
        authoritative — any `amount` in the body is ignored, so a client cannot
        underpay by editing the request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, proof_of_payment]
              properties:
                invoice_id:
                  type: integer
                  example: 41
                amount:
                  type: number
                  deprecated: true
                  description: Ignored. The invoice total is always used.
                  example: 1500
                payment_method:
                  type: string
                  default: GCash
                proof_of_payment:
                  type: string
                  minLength: 5
                  description: Reference number or proof image URL.
                  example: GCASH-REF-889231
      responses:
        '201':
          description: Proof recorded pending approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invoice is already Paid or Void.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /payments/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    put:
      tags: [Payments]
      summary: Approve a payment (admin)
      description: |
        In one transaction: payment → `Paid`, invoice → `Paid`, linked booking →
        `Confirmed`, linked subscription → `Active` with refreshed billing dates.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment approved and linked records activated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: '#/components/schemas/Payment'
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /payments/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    put:
      tags: [Payments]
      summary: Reject a payment (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment marked `Rejected`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /payments/paymongo/checkout:
    post:
      tags: [Payments]
      summary: Create a PayMongo checkout session
      description: |
        Builds a PayMongo Checkout Session (GCash, Maya, card, etc.) and returns
        the hosted checkout URL.

        The payable amount, line-item name and return URLs are resolved from the
        invoice stored in the database. Any `amount` / `service_name` sent by the
        client is ignored, so prices cannot be tampered with.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  provider:
                    type: string
                    example: paymongo
                  sandbox:
                    type: boolean
                    description: True when an `sk_test_` key is configured.
                  checkout_url:
                    type: string
                    format: uri
                  checkout_session_id:
                    type: string
                    example: cs_9f1c2b7a
                  invoice_id:
                    type: integer
                  amount:
                    type: number
                    description: Server-side invoice total actually charged.
        '400':
          description: Missing/invalid PayMongo key, no payable amount, or PayMongo rejected the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No invoice matches invoice_id / booking_id / subscription_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invoice is already Paid or Void.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify payment completion
      description: |
        Two modes:

        1. **Registration mode** — when `reg_token` is supplied, the pending
           registration is redeemed atomically: `User` + `Customer` + active
           `Subscription` + `Paid` ₱1,500 invoice + `Paid` payment are created, the
           pending row is deleted, and a JWT is returned for instant login.
        2. **Checkout mode** — with `invoice_id`, `booking_id` and/or
           `subscription_id`, a `Paid` payment is recorded, the invoice is marked
           `Paid`, the booking `Confirmed`, and the subscription `Active`, then an
           invoice receipt email is sent.

        **Known limitation:** no PayMongo webhook signature is checked; the redirect
        query string is trusted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reg_token:
                  type: string
                  description: Opaque registration token from the checkout success URL.
                invoice_id:
                  type: integer
                booking_id:
                  type: integer
                subscription_id:
                  type: integer
                payment_method:
                  type: string
                  example: PayMongo (GCash/Maya/Card)
      responses:
        '200':
          description: |
            Payment verified. Registration mode returns `token` + `user`; checkout
            mode returns `data.success` and the created payment.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RegistrationVerifiedResponse'
                  - $ref: '#/components/schemas/PaymentVerifiedResponse'
        '400':
          description: Expired/invalid registration token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

