  /subscriptions/renew:
    post:
      tags: [Subscriptions]
      summary: Start a membership renewal
      description: |
        Creates or reuses a ₱1,500 `Monthly Roster` invoice. It never suspends an
        active plan: the member keeps VIP perks while the invoice is open, and the
        plan becomes `Active` only once the payment is verified.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_tier:
                  type: string
                  default: Unlimited Basic Wash
      responses:
        '200':
          description: Renewal invoice generated (reuses any open renewal invoice).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      subscription:
                        $ref: '#/components/schemas/Subscription'
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /subscriptions/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel a membership at period end
      description: |
        Schedules cancellation instead of revoking access immediately: the plan
        becomes `Cancellation Pending`, `auto_renew` is disabled, and the member
        keeps every perk until `next_billing_date`. Admins may target another
        member via `email`. Reactivating later reverses it while the period is
        still paid.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Admin only — cancel another member's plan.
      responses:
        '200':
          description: Cancellation scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    description: Includes the date VIP perks remain active until.
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Subscription'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /subscriptions/reactivate:
    post:
      tags: [Subscriptions]
      summary: Reactivate a membership
      description: |
        Members can reverse a pending cancellation for free while their paid
        period is still running. Expired / `Payment Pending` plans need a payment
        instead and receive a renewal invoice (`checkout_required: true`). Admins
        may activate any member immediately by passing `email`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Admin only — reactivate another member's plan.
      responses:
        '200':
          description: |
            Either activated immediately (`checkout_required: false`) or a renewal
            invoice is returned (`checkout_required: true`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  checkout_required:
                    type: boolean
                  data:
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /subscriptions/auto-renew:
    put:
      tags: [Subscriptions]
      summary: Turn auto-renewal on or off
      description: |
        Disabling auto-renew keeps access until the period ends and then expires
        the plan. Re-enabling it also reverses a pending cancellation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auto_renew]
              properties:
                auto_renew:
                  type: boolean
      responses:
        '200':
          description: Preference saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /subscriptions/payment-method:
    put:
      tags: [Subscriptions]
      summary: Save a card for automatic renewal
      description: |
        Stores a PayMongo PaymentMethod id (`pm_...`) created client-side with
        PayMongo.js. Cards are charged automatically on the renewal date; GCash
        and Maya cannot be charged unattended and stay on auto-invoicing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_id]
              properties:
                payment_method_id:
                  type: string
                  pattern: '^pm_[A-Za-z0-9]+$'
                  example: pm_abc123
                brand:
                  type: string
                  example: visa
                last4:
                  type: string
                  example: '4242'
      responses:
        '200':
          description: Card saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      saved:
                        type: boolean
                      brand:
                        type: string
                        nullable: true
                      last4:
                        type: string
                        nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Subscriptions]
      summary: Remove the saved card
      description: The member falls back to auto-invoicing on the next cycle.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Card removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      saved:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

